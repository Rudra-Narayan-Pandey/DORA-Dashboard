<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Definitions for glowing gradients -->
  <defs>
    <linearGradient id="cyanIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#5d5fef" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Grid lines (futuristic hud style) -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(0, 242, 254, 0.1)" stroke-width="1" stroke-dasharray="2 2" />
  <circle cx="50" cy="50" r="30" fill="none" stroke="rgba(93, 95, 239, 0.1)" stroke-width="1" />
  <line x1="50" y1="5" x2="50" y2="95" stroke="rgba(0, 242, 254, 0.1)" stroke-width="0.5" />
  <line x1="5" y1="50" x2="95" y2="50" stroke="rgba(0, 242, 254, 0.1)" stroke-width="0.5" />

  <!-- Connecting Node Lines -->
  <path d="M 50 20 L 25 60 L 75 60 Z M 50 20 L 50 80" fill="none" stroke="url(#cyanIndigo)" stroke-width="2" filter="url(#neonGlow)" />
  
  <!-- Nodes (Telemetry Points) -->
  <!-- Top Node (Deployments) -->
  <circle cx="50" cy="20" r="6" fill="#050816" stroke="#00f2fe" stroke-width="2" filter="url(#neonGlow)" />
  <circle cx="50" cy="20" r="2" fill="#00f2fe" />

  <!-- Left Node (Lead Time) -->
  <circle cx="25" cy="60" r="6" fill="#050816" stroke="#5d5fef" stroke-width="2" filter="url(#neonGlow)" />
  <circle cx="25" cy="60" r="2" fill="#5d5fef" />

  <!-- Right Node (Failure Rate) -->
  <circle cx="75" cy="60" r="6" fill="#050816" stroke="#8b5cf6" stroke-width="2" filter="url(#neonGlow)" />
  <circle cx="75" cy="60" r="2" fill="#8b5cf6" />

  <!-- Bottom Node (MTTR) -->
  <circle cx="50" cy="80" r="6" fill="#050816" stroke="#05ffc4" stroke-width="2" filter="url(#neonGlow)" />
  <circle cx="50" cy="80" r="2" fill="#05ffc4" />
</svg>
